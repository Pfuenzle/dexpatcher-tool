ext.configurePom = { pom ->
    pom.description = 'Android Dalvik bytecode patcher. Fork of DexPatcher.'
    pom.url = 'https://github.com/Pfuenzle/dexweaver-tool'
    pom.organization {
        name = 'DexWeaver'
        url = 'https://github.com/Pfuenzle/dexweaver-tool'
    }
    pom.licenses {
        license {
            name = 'GNU General Public License (version 3 or later)'
            url = 'https://www.gnu.org/licenses/gpl.txt'
        }
    }
    pom.developers {
        developer {
            name = 'pfuenzle'
            url = 'https://github.com/Pfuenzle'
        }
    }
    pom.scm {
        connection = 'scm:git:git://github.com/Pfuenzle/dexweaver-tool.git'
        developerConnection = 'scm:git:ssh://github.com:Pfuenzle/dexweaver-tool.git'
        url = 'https://github.com/Pfuenzle/dexweaver-tool'
    }
}

publishing {
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repository')
        }
        if (project.hasProperty('publishing.url')) {
            maven {
                name = 'remote'
                url = project.getProperty('publishing.url')
                credentials {
                    username = project.getProperty('publishing.username')
                    password = project.getProperty('publishing.password')
                }
            }
        }
    }
}

signing {
    if (project.hasProperty('signing.secretKeyRingFile')) {
        sign publishing.publications
    }
}

assemble.dependsOn publishAllPublicationsToLocalRepository

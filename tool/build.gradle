plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '5.2.0'
    id 'maven-publish'
    id 'signing'
}

group = parent.group
version = parent.version

ext.mainArtifact = 'dexweaver-tool'
ext.artifactName = 'DexWeaver-tool'

def fatArtifact = 'dexweaver'

sourceCompatibility = '1.8'

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

def dexlib2Version = '3.0.10'

dependencies {
    implementation 'commons-cli:commons-cli:1.4'
    implementation 'com.github.Pfuenzle:multidexlib2:v3.0.10.r3'
    api 'com.android.tools.smali:smali-dexlib2:' + dexlib2Version
}

compileJava {
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}

apply from: '../configure-artifacts.gradle'

def versionFile = layout.buildDirectory.file('version-file/version')

task createVersionFile {
    inputs.property 'version', version
    outputs.file versionFile
    doLast {
        versionFile.get().asFile.text = version
    }
}

processResources {
    dependsOn createVersionFile
    from(versionFile) {
        into 'io/pfuenzle/dexweaver'
    }
}

// The Shadow plugin erroneously unpacks nested jars.
// The issue can be worked around by double-jarring the jars.
task shadowBugWorkaround(type: Jar) {
    destinationDirectory.set layout.buildDirectory.dir('shadow-bug-workaround')
    archiveBaseName.set 'nested-content'
    from jar
    from tasks.getByPath(':annotation:jar')
}

shadowJar {
    archiveBaseName.set fatArtifact
    archiveClassifier.set null
    manifest {
        attributes(
                'Main-Class': 'io.pfuenzle.dexweaver.Main'
        )
    }
    exclude '*.txt'
    exclude 'META-INF/*.txt'
    exclude 'META-INF/maven/**'
    from('about') {
        into 'META-INF/about'
    }
    //from jar
    //from tasks.getByPath(':annotation:jar')
    from shadowBugWorkaround
}

assemble.dependsOn shadowJar
build.dependsOn shadowJar, tasks.getByPath(':annotation:build')

apply from: '../configure-publishing.gradle'

publishing {
    publications {
        dexpatcherTool(MavenPublication) {
            artifactId = mainArtifact
            from components.java
            pom {
                name = artifactName
                configurePom it
            }
        }
        dexpatcher(MavenPublication) {
            artifactId = fatArtifact
            artifact shadowJar
            artifact javadocJar
            artifact sourcesJar
            pom {
                name = artifactName + ' (Fat JAR)'
                configurePom it
            }
        }
    }
}

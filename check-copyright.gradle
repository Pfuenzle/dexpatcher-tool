task checkCopyrightNotice {
    dependsOn { subprojects*.tasks.build }
    // The upstream copyright notice is preserved verbatim, including its
    // original year range, so this check only verifies that the notice is
    // present rather than that it has been rolled forward.
    def checkNotice = { noticeFile ->
        if (!file(noticeFile).text.contains('DexPatcher - Copyright 2015-')) {
            System.err.println "********************************  WARNING  ********************************"
            System.err.println "Missing copyright notice: ${noticeFile}"
            System.err.println "***************************************************************************"
        }
    }
    doLast {
        checkNotice 'NOTICE.txt'
    }
}

build {
    dependsOn checkCopyrightNotice
}
